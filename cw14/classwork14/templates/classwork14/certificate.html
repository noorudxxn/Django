<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .certificate {
            border: 8px solid #d4af37;
            padding: 40px;
            height: 400px;
        }

        h1 {
            color: #b8860b;
            font-size: 35px;
        }

        h2 {
            color: #333;
            font-size: 28px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="certificate">

    <h1>Certificate of Completion</h1>

    <p>This certificate is proudly presented to</p>

    <h2>{{ student_name }}</h2>

    <p>For successfully completing the course</p>

    <h2>{{ course_name }}</h2>

    <p>Completion Date: {{ completion_date }}</p>

    <br><br>

    <p>Congratulations on your achievement!</p>

    <p>Training Institute</p>

</div>

</body>
</html>

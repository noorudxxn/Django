<!DOCTYPE html>
<html>
<head>
    <title>Filtered Customers</title>
</head>
<body>

    <h1>Customers with @example.com</h1>

    {% for customer in customers %}

        <p>
            Name: {{ customer.name }} <br>
            Email: {{ customer.email }}
        </p>

        <hr>

    {% empty %}

        <p>No matching customers found.</p>

    {% endfor %}

    <a href="{% url 'add_customer' %}">Add Customer</a>

    <br>

    <a href="{% url 'all_customers' %}">View All Customers</a>

</body>
</html>

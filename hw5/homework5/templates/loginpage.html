<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Full Name:</label>
        {{ form.full_name }}
        {{ form.full_name.errors }}

        <br><br>

        <label>Email:</label>
        {{ form.email }}
        {{ form.email.errors }}

        <br><br>

        <label>Password:</label>
        {{ form.password }}
        {{ form.password.errors }}

        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
